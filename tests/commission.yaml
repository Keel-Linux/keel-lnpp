# The commissioning contract of keel-lnpp (handbook decision 0075).
# bin/keel-commission of Keel-Linux/.github reads it: it makes a container
# from the template as an operator does, answers the first boot (or
# preseeds it with the instance below), and proves each password by a
# login with it. A new first boot question or secret is a change of this
# file in the same pull request.
contract: 1
appliance: lnpp
secrets: [root, db]
# The prompts are the titles that the first boot draws on tty1. A password
# comes first as a menu of the same title (Generate or Manual), and the
# runner takes Manual.
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  - id: db_password
    hook: 35pgsqlpass
    prompt: PostgreSQL Password
    answer: secret:db
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of this repository, with the secrets of the
# run and no instance name: the machine keeps the name pct create gave it
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: lnpp
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
    nginx: enabled
    coraza: disabled
    anubis: disabled
    syncthing: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
proofs:
  - {secret: root, kind: shadow, user: root}
  # a TCP login on each loopback: pg_hba.conf asks a password there
  - {secret: db, kind: pgsql, user: postgres, host: 127.0.0.1, database: postgres}
  - secret: db
    kind: command
    run: PGPASSWORD="$SECRET" psql -h ::1 -U postgres -d postgres -Atc 'SELECT 1' | grep -qx 1
# The check page is started by its socket (keel-lnpp-check.socket), so the
# service runs only once a request came.
services: [nginx, postgresql, keel-lnpp-check.socket, webmin, cron, postfix, ssh]
urls:
  - {url: 'https://127.0.0.1/', status: 200}
  - {url: 'https://127.0.0.1/keel-check/', status: 200}
  # port 80 of the loopback is keel-default's (keel-web 0.4.0, handbook
  # decision 0079): with the self-signed certificate of the first boot it
  # serves the site and the check page as 443 does, with no redirect, and
  # /keel-health 204 for the monitor
  - {url: 'http://127.0.0.1/', status: 200}
  - {url: 'http://127.0.0.1/keel-check/', status: 200}
  - {url: 'http://127.0.0.1/keel-health', status: 204}
  - {url: 'https://127.0.0.1:12321/', status: 200}
# The web pages of the gallery (decision 0077): the default site, the check
# page of the stack, and Webmin before and after the login with the root
# secret.
screenshots:
  - {name: site, url: /}
  - {name: keel-check, url: /keel-check/}
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    # the dashboard of Webmin draws after the login; 8 s took a half
    # drawn page on a busy VM of BR2 (vm-iso, 2026-11-06)
    wait: 20
# The cloud modes (decision 0076): PostgreSQL is a replicating engine (the
# pair of decisions 0054 and 0057), and the site files follow the VIP. The
# prompts are the titles of the confconsole screens, the shape of the
# reference contract of .github (tests/fixtures/commission/wordpress.yaml).
# This part is declared for the cloud passes; the single node passes do not
# read it.
cloud:
  capture:
    # keel1: an invite without a VIP, keel2: one that carries it (keel 0.23.83)
    invite: 'keel[12]:[A-Za-z0-9_.~+/=-]+'
    # the label anchors it: the usage screen shows the node's own addresses too
    vip: 'VIP:? +([0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,7})'
  # the screens on which a node waits for another: no key while they are up
  waits: [Waiting for the nodes]
  # the proofs across the pair, in order: one VIP holder, a row written on
  # the primary and read on the standby, the Syncthing folder types of the
  # site files, and a promote and its return
  # modes: a check runs only in the cloud modes it names; one without
  # modes runs in both (keel-commission of Keel-Linux/.github)
  checks:
    - {id: vip-holder, at: all, run: 'keel vip status', match: 'carried here: yes', count: 1}
    - {id: voters, at: all, run: 'keel mesh status --json | grep -o "\"healthy_voters\": *[0-9]*"', match: ': *3$', count: 3, modes: [cloud_advanced]}
    - {id: witness-no-data, at: witness, run: 'test ! -e /var/lib/postgresql/17/main && test ! -e /usr/share/keel-lnpp && echo nodata', match: '^nodata$', modes: [cloud_advanced]}
    # the standby is a copy of the primary, made before the pair formed:
    # the same cluster (system identifier) and the primary's first boot
    # data (a MariaDB replica was not seeded, keel-lnmp BR1/BR2 2026-11-06)
    - {id: seeded, at: 'primary,replica', run: '{ runuser -u postgres -- psql -Atc "SELECT system_identifier FROM pg_control_system()"; runuser -u postgres -- psql -d keel_check -Atc "SELECT host, written_at FROM boot ORDER BY host"; } | tr "\n" " "', same: true}
    - {id: row-written, at: primary, run: 'runuser -u postgres -- psql -v ON_ERROR_STOP=1 -d postgres -qc "CREATE TABLE IF NOT EXISTS kc_probe (v int); INSERT INTO kc_probe VALUES (42)"'}
    - {id: row-replicated, at: replica, run: 'sleep 5; runuser -u postgres -- psql -d postgres -Atc "SELECT v FROM kc_probe"', match: '^42$'}
    - {id: replica-in-recovery, at: replica, run: 'runuser -u postgres -- psql -d postgres -Atc "SELECT pg_is_in_recovery()"', match: '^t$'}
    - {id: files-follow, at: replica, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'receiveonly'}
    - {id: files-sent, at: primary, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'sendonly'}
    # the semi-synchronous fallback (keel 0.23.88): with the standby's server
    # stopped, a write on the primary still finishes; monit is stopped too, so
    # nothing starts the server again during the check
    - {id: standby-stopped, at: replica, run: 'systemctl stop monit; systemctl stop postgresql; systemctl is-active postgresql@17-main || echo stopped', match: 'stopped', modes: [cloud_simple]}
    - {id: write-without-standby, at: primary, run: 'timeout 180 runuser -u postgres -- psql -v ON_ERROR_STOP=1 -d postgres -qc "CREATE TABLE IF NOT EXISTS kc_async (v int); INSERT INTO kc_async VALUES (1)" && echo written', match: '^written$', modes: [cloud_simple]}
    - {id: standby-back, at: replica, run: 'systemctl start postgresql; systemctl start monit; for i in $(seq 60); do s=$(runuser -u postgres -- psql -Atc "SELECT status FROM pg_stat_wal_receiver" 2>/dev/null); [ "$s" = streaming ] && break; sleep 3; done; echo $s', match: '^streaming$', modes: [cloud_simple]}
    - {id: async-row-replicated, at: replica, run: 'for i in $(seq 30); do v=$(runuser -u postgres -- psql -d postgres -Atc "SELECT count(*) FROM kc_async" 2>/dev/null); [ "$v" = 1 ] && break; sleep 2; done; echo $v', match: '^1$', modes: [cloud_simple]}
    - {id: promote, at: replica, run: 'keel vip promote', modes: [cloud_simple]}
    - {id: promoted-holder, at: replica, run: 'keel vip status', match: 'carried here: yes', modes: [cloud_simple]}
    - {id: promoted-writable, at: replica, run: 'for i in $(seq 30); do r=$(runuser -u postgres -- psql -d postgres -Atc "SELECT pg_is_in_recovery()"); [ "$r" = f ] && break; sleep 2; done; echo $r', match: '^f$', modes: [cloud_simple]}
    # the old primary follows the promoted node before the VIP goes back: a
    # return before it has rejoined leaves the pair with no writable server
    # (keel 0.23.84, keel-lnpp BR1/BR2 2026-11-06)
    - {id: rejoined, at: primary, run: 'for i in $(seq 60); do s=$(runuser -u postgres -- psql -Atc "SELECT status FROM pg_stat_wal_receiver"); [ "$s" = streaming ] && break; sleep 3; done; echo $s', match: '^streaming$', modes: [cloud_simple]}
    - {id: return, at: primary, run: 'keel vip promote', modes: [cloud_simple]}
    - {id: returned-holder, at: primary, run: 'keel vip status', match: 'carried here: yes', modes: [cloud_simple]}
    - {id: probe-dropped, at: primary, run: 'for i in $(seq 30); do runuser -u postgres -- psql -v ON_ERROR_STOP=1 -d postgres -qc "DROP TABLE kc_probe; DROP TABLE IF EXISTS kc_async" 2>/dev/null && exit 0; sleep 2; done; exit 1', modes: [cloud_simple]}
    - {id: probe-dropped, at: primary, run: 'runuser -u postgres -- psql -v ON_ERROR_STOP=1 -d postgres -qc "DROP TABLE kc_probe"', modes: [cloud_advanced]}
nodes:
  - name: primary
    site: br1
    mode: cloud_simple
    role: primary
    # the hotkeys of the menus (the first letter of an item): an arrow key is
    # an escape sequence, and the console of a container can hand dialog its
    # ESC alone, which cancels the screen (BR1, 2026-11-06)
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
  - name: replica
    site: br2
    mode: cloud_simple
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
    # the check page of the standby says that its server is read-only
    screenshots:
      - {name: site, url: /}
      - {name: keel-check, url: /keel-check/, text: read-only (a standby, in recovery)}
      - name: webmin
        port: 12321
        url: /
        login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
        # the dashboard of Webmin draws after the login; 8 s took a half
        # drawn page on a busy VM of BR2 (vm-iso, 2026-11-06)
        wait: 20
  # cloud advanced (decision 0076): the primary and the Keel Core witness
  # on BR1, the replica on BR2 while BR3 is down. The names differ from the
  # nodes of cloud simple: a record names each check NODE:CHECK.
  - name: adv-primary
    site: br1
    mode: cloud_advanced
    role: primary
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
      - {id: invite2, prompt: Invite a node, keys: '{ret}'}
  - name: adv-replica
    site: br2
    mode: cloud_advanced
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
    screenshots:
      - {name: site, url: /}
      - {name: keel-check, url: /keel-check/, text: read-only (a standby, in recovery)}
      - name: webmin
        port: 12321
        url: /
        login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
        wait: 20
  - name: witness
    site: br1
    mode: cloud_advanced
    role: witness
    # the witness is a node of keel-core, with the contract of keel-core
    # (a copy of its tests/commission.yaml): the image of keel-core is a new
    # build for each release, so the run gives it as KC_IMAGE_WITNESS
    contract: commission-core.yaml
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'W{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:2}{ret}'}
