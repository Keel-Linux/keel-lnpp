# Tests of the keel-lnpp layer recipe (handbook decision 0059), on the
# Forgejo runners of Keel-Linux (decision 0056). Each call of a reusable
# workflow has a runs-on line, because Forgejo runs a called workflow on
# the runner of the caller.
#   tests:     the shell this layer writes under bats and kcov
#              (tests/coverage.sh), with the threshold committed here
#   python:    the check page (overlay/usr/share/keel-lnpp/app) under
#              pytest and coverage, lines and branches
#   stack:     PostgreSQL, the first boot hook of the page, gunicorn from
#              its systemd socket and Nginx with keel-web's include
#              directory, on a booted trixie container (tests/stack.bats),
#              and keel's schema check of the manifest and the specs
#   appliance: fetch the published layer, verify it, assemble it, boot it
#              in LXC and run tests/boot-test.sh against it
#   package:   a change that the layer ships needs a changelog entry
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Six shell files, all at 100 percent (COVERAGE.md). The threshold is
    # the measured number and is only ever raised (decision 0006).
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 100
  python:
    # The check page, keel_check.py: 100 percent of lines and branches,
    # measured on 2026-10-16. psycopg is not needed: the tests give the
    # application a fake connection.
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/test-python.yml@main
    with:
      threshold: 100
      package: overlay/usr/share/keel-lnpp/app
      tests: tests/python
  stack:
    # The stack on a machine, from Debian 13's packages. keel-web 0.3.0 is
    # not installed: tests/stack.bats puts a stand-in default site with its
    # include line in place. keel validates the manifest against the
    # manifests of the chain, taken from the commits pinned below.
    runs-on: keel-lxc
    uses: keel-linux/.github/.github/workflows/lxc-trixie.yml@main
    with:
      systemd: true
      timeout: 30
      run: |
        # The commits of 2026-10-16, the day of the last green run, and the
        # same commits that keel-lnmp pins: keel 0.23.32, keel-core and
        # keel-web with the manifests of the chain, and common 19.x. A branch
        # name moves: keel-web master has the syncthing overlay now (0.3.4),
        # which these commits of keel and common do not know. Read from the
        # GitHub mirrors (decision 0056): the containers of the runner do not
        # reach git.pop.coop, as keel-web's site job also shows.
        KEEL_COMMIT=384afa6bfea7990159f827b93f4ad2f01f51f676
        CORE_COMMIT=432be9fafd3afd091690fcce3433d4721b5b83f6
        WEB_COMMIT=493438a993a2c46ad9bba58881f56e889a049298
        COMMON_COMMIT=cff023f0b40ddc5c24baf92b25ce1f233f348f94
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates git bats curl iproute2 procps nginx postgresql \
          postgresql-client gunicorn python3-psycopg python3-yaml adduser
        fetch() {
          git init -q "/tmp/src/$1"
          git -C "/tmp/src/$1" fetch -q --depth 1 "https://github.com/Keel-Linux/$1.git" "$2"
          git -C "/tmp/src/$1" checkout -q FETCH_HEAD
        }
        fetch keel "$KEEL_COMMIT"
        fetch keel-core "$CORE_COMMIT"
        fetch keel-web "$WEB_COMMIT"
        fetch common "$COMMON_COMMIT"
        mkdir -p /tmp/manifests/overlays
        cp /tmp/src/keel-core/packages/keel-core/manifest.yaml /tmp/manifests/core.yaml
        cp /tmp/src/keel-web/packages/keel-web/manifest.yaml /tmp/manifests/web.yaml
        for overlay in installer wireguard etcd crowdsec vip nginx coraza anubis; do
          cp "/tmp/src/common/packages/$overlay/manifest.yaml" "/tmp/manifests/overlays/$overlay.yaml"
        done
        for _ in $(seq 30); do pg_isready -q && break; sleep 1; done
        KEEL_LNPP_STACK_TEST=1 KEEL_SRC=/tmp/src/keel KEEL_MANIFESTS=/tmp/manifests \
          bats tests/stack.bats
  appliance:
    # The boot test (org-plan section 1): the lnpp layer is fetched from
    # https://mirror.keellinux.org/layers with web and core under it,
    # verified, assembled, booted in LXC and checked by tests/boot-test.sh.
    # The lnpp layer is published (stable 1, 2026-10-26), so
    # allow_unpublished is gone: the workflow makes it an error once the
    # mirror answers. The evidence for this branch is the image built from
    # it and booted on the real platform (tests/README.md).
    if: vars.KEEL_LXC_RUNNER == 'true'
    runs-on: keel-lxc
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: lnpp
      parent: web
      timeout: 60
  package:
    # Only on a pull request: require-changelog compares the two commits of
    # the pull request. What bt-layer records in the manifest is the top
    # entry of ./changelog, so that is the file a change which ships has to
    # bump.
    if: github.event_name == 'pull_request'
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/require-changelog.yml@main
    with:
      changelog: changelog
      exempt: '^(tests/|docs/|\.github/|\.forgejo/|keel/|README|COVERAGE\.md|LICENSE|\.gitignore)'
