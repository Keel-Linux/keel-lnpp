# Instance description of an LNPP appliance, standalone, IPv6 first (docs/spec.md in
# the keel repository). Copy to /etc/keel/instance.yaml and create the two
# secret files (mode 0600, owned by root) before the first boot:
#
#   /etc/keel/secrets/root_password
#   /etc/keel/secrets/db_password     the PostgreSQL 'postgres' role
#
# secrets.db_password is what reaches the database. Leave it out and the
# first boot has nothing to set the role with: firstboot.d/36pgsqlverify
# says so and fails, and the role stays unable to authenticate, which is
# the state conf.d/main published the layer in.
version: 1

instance:
  hostname: lnpp
  fqdn: lnpp.example.org

network:
  # LXC: the host owns eth0 and the address comes by SLAAC from the host's
  # /64. Switch to method static with an address once a DNS record points
  # at it, so the address the record names never moves.
  managed_by: host
  interfaces:
    eth0:
      ipv6:
        method: auto

tls:
  acme:
    # The database speaks its own protocol on 5432 and this layer serves no
    # web page of its own. Webmin, on 12321, carries its own certificate.
    enabled: false

secrets:
  root_password:
    file: /etc/keel/secrets/root_password
  db_password:
    file: /etc/keel/secrets/db_password

app:
  options:
    db_user: postgres

hub:
  api_key: skip

security:
  alerts: skip
  updates_at_first_boot: skip

first_login_wizard: false
