manifest_version: 1
kind: appliance
name: lnpp
title: Keel LNPP
summary: Nginx, PostgreSQL and Python with gunicorn on Keel Web, alone or as a replicated pair (0059)
base: web
# The overlays are Core's and Web's, inherited with their states: this
# layer adds none, and a spec that names it writes all eight out (0027).
processes:
  - name: postgresql
    unit: postgresql.service
    # ::1 and 127.0.0.1 as the layer ships it; on a pair,
    # database.server.listen adds the node's overlay address and the VIP,
    # so 5432 is a mesh port: on the WireGuard interface, never on the
    # uplink.
    listen: [{port: 5432, protocol: tcp, expose: mesh}]
  # gunicorn of the check page is not a process here. Its socket unit starts
  # it at the first request to /keel-check/, so it does not run until then,
  # and Monit requires each process of a manifest to be active: as a process
  # it got a restart and a critical alert after each boot where nobody had
  # asked the page. systemd holds the socket and starts gunicorn again at
  # the next request. A layer built on lnpp that removes the page has
  # nothing to keep for it.
checks:
  - {name: postgresql, process: postgresql, type: protocol, protocol: pgsql,
     address: loopback, port: 5432, on_failure: restart}
secrets:
  - name: db_password
    description: The PostgreSQL role the first boot sets, from DB_PASS
    generate: allowed
    # the database replicates with the rest: a pair holds one value
    shared: true
