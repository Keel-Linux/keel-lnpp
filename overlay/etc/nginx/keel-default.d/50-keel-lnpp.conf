# keel-lnpp: the route of the check page (handbook decision 0059, points 4
# and 6), included by keel-web's default site and by its server behind
# Anubis. gunicorn answers on the unix socket of keel-lnpp-check.socket.
# The page only reads, so only GET and HEAD reach it.
location = /keel-check {
	return 301 /keel-check/;
}

location ^~ /keel-check/ {
	limit_except GET {
		deny all;
	}
	proxy_pass http://unix:/run/keel-lnpp/check.sock;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_redirect off;
}
